    THESIS: the board reads as a clean modern app object — restrained neutral ground,
    one owned accent color, flat geometric tokens — refusing the illustrated-game-piece
    default in favor of precision and quiet.
    OWN-WORLD: modern minimal — charcoal-navy ground, a single coral accent, sage as a
    secondary semantic color, cream card surfaces; Sora (display) + Manrope (body); flat
    rounded-square tokens with no outline, soft ambient shadows only (no hard offset).
    STORY: the active player instantly sees whose turn it is, rolls the die, watches their
    avatar spring to the landed square, and reads the effect on a card that rises in place.
    FIRST VIEWPORT: BLACKOUT logo + "à toi de jouer" card up top, the spiral board
    centered filling the rest, numeral die + score rail at the foot.
    FORM: creator-directed redesign from three live coded comparisons, not a fresh
    concept-seed roll — the brief was concrete critique + explicit component choices,
    not an open pick.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
    review, the verdict, and DESIGN.md.
